<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .ro 
    {
        display: grid;
        flex-wrap: grid;
        justify-content: left;
    }
    .button 
    {
        width: 150px;
        height: 50px;
        background-color: #727272;
        transition: 0.5s;

        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: left;
    }

    .button img 
    {
        width: 50px;
        height: 50px;
    }

    .button:hover 
    {
        background-color: #626262;
    }

    p
    {
        margin-left: 10px;
        color: white;
        font-family: Arial;
        font-size: 12px;
    }
</style>
<body>
    <div class="ro">
        <div class="button">
            <img src="images/edit.png" alt="Edit">
            <p>EDIT</p>
        </div>
        <div class="button">
            <img src="images/favorites.png" alt="favorites">
            <p>FAVORITES</p>
        </div>
        <div class="button">
            <img src="images/history.png" alt="history">
            <p>HISTORY</p>
        </div>
        <div class="button">
            <img src="images/security.png" alt="security">
            <p>SECURITY</p>
        </div>
        <div class="button">
            <img src="images/settings.png" alt="settings">
            <p>SETTINGS</p>
        </div>
    
</body>
</html>
