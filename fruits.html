<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body
    {
        text-align: center;
        margin: 0;
        padding: 20px;
        background-color: rgb(213, 207, 207);
        font-family: Arial, sans-serif;
    }
    h1
    {
        margin-bottom: 20px;
    }
    .products 
    {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
    }
    .product 
    {
        border: 3px solid #cdcdcd;
        border-radius: 10px;
        width: 120px;
        padding: 30px;
        background-color: #c3c3c3;
        transition: 0.5s;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .product:hover 
    {
        transform: scale(1.05);
        border-color: #5f5e5e;
    }

    .product img 
    {
        width: 150px;
        height: 150px;
    }

    .product p
    {
        margin-top: 10px;
        font-weight: bold;
    }

    footer 
    {   
        margin-top: 30px;
        font-style: italic;
        color: #555;
    }
</style>
<body>
    <h1>What do I have in fridge?</h1>
    <div class="products">
        <div class="product">
            <img src="images/Pepper.png" alt="Pepper">
            <p>Pepper</p>
        </div>
        <div class="product">
            <img src="images/Cheese.png" alt="Cheese">
            <p>Cheese</p>
        </div>
        <div class="product">
            <img src="images/Corn.png" alt="Corn">
            <p>Corn</p>
        </div>
        <div class="product">
            <img src="images/Mushrooms.png" alt="Mushrooms">
            <p>Mushrooms</p>
        </div>
        <div class="product">
            <img src="images/Garlic.png" alt="Garlic">
            <p>Garlic</p>
        </div>
        <div class="product">
            <img src="images/Meat.png" alt="Meat">
            <p>Meat</p>
        </div>
        <div class="product">
            <img src="images/Fish.png" alt="Fish">
            <p>Fish</p>
        </div>
        <div class="product">
            <img src="images/Egg.png" alt="Egg">
            <p>Egg</p>
        </div>
        <div class="product">
            <img src="images/Salad.png" alt="Salad">
            <p>Salad</p>
        </div>
    </div>
</body>
</html>
