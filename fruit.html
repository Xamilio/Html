<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список фруктов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }

        ol {
            background-color: rgb(235, 129, 159);
            padding: 20px;
            width: 700px;
            margin: 30px auto;
        }
        
        li {
            background-color: rgb(201, 118, 141);
            margin: 10px 0;
            padding: 10px;
            list-style-position: inside;
        }

        span {
            background-color: rgb(122, 55, 74);
            color: white;
            padding: 10px 15px;
        }
    </style>
</head>
<body>
    <ol>
        <li><span>Apple</span></li>
        <li><span>Orange</span></li>
        <li><span>Pineapple</span></li>
        <li><span>Pear</span></li>
        <li><span>Cherry</span></li>
    </ol>
</body>
</html>
